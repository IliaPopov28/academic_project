syntax = "proto3";

package events.v1;

option go_package = "github.com/foodly/contracts/gen/go/events/v1;eventsv1";

message EventMeta {
    string event_id = 1;
    int64 occurred_at_unix_ms = 2;
}

message OrderCreated {
    EventMeta meta =1;
    string order_id = 2;
    string user_id = 3;
    string restaurant_id = 4;
    int64 total_price_minor = 5;
}

message OrderPaid {
    EventMeta meta = 1;
    string order_id = 2;
    string payment_id = 3;
}

message OrderCancelled {
    EventMeta meta = 1;
    string order_id = 2;
}

message PaymentSucceeded { 
    EventMeta meta = 1;
     string payment_id = 2;
    string order_id = 3;
    int64 amount_minor = 4;
}

message PaymentFailed {
    EventMeta meta = 1;
    string order_id = 2;
}

message StockReserved {
    EventMeta meta = 1;
    string reservation_id = 2;
    string restaurant_id = 3;
}

message StockReleased {
    EventMeta meta = 1;
    string reservation_id = 2;
}